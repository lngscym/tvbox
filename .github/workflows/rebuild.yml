name: Rebuild TVBox Config

on:
  schedule:
    - cron: "0 2,14 * * *"      # 每天 10:00 / 22:00（北京时间）
  workflow_dispatch:            # 也可手动点击运行
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "build.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build config
        run: python build.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --staged --quiet; then
            echo "配置无变化，跳过提交"
          else
            git commit -m "chore: 自动重建配置 ($(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M'))"
            git push
          fi
